name: Deploy to AWS Lambda - lambda-authorizer

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: deploy_lambda_authorizer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies and package Lambda for deploy_lambda_authorizer
        run: |
          cd lambda/lambda_authorizer
          pip install -r requirements.txt -t python  
          cp lambda_authorizer.py python/ 
          cd python
          zip -r ../../../lambda_authorizer_handler_lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: "Debug: Current directory and files"
        run: |
          echo "Current directory: $(pwd)"
          ls -l

      - name: Verify lambda_authorizer_handler_lambda.zip exists
        run: |
          if [ ! -f $(pwd)/lambda_authorizer_handler_lambda.zip ]; then echo "lambda_authorizer_handler_lambda.zip does not exist"; exit 1; fi

      - name: Deploy deploy_lambda_authorizer to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name lambda-authorizer \
            --zip-file fileb://$(pwd)/lambda_authorizer_handler_lambda.zip
