name: Deploy to AWS Lambda - delete_analysis_results

on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'delete_analysis_results/**'
  pull_request:
    branches:
      - master
      - dev
    paths:
      - 'delete_analysis_results/**'

jobs:
  deploy:
    name: deploy_delete_analysis_results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies and package Lambda for deploy_delete_analysis_results
        run: |
          cd lambda/delete_analysis_results
          pip install -r requirements.txt -t python  
          cp delete_analysis_results_handler.py python/ 
          cd python
          zip -r ../../../delete_analysis_results_handler_lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.NEW_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NEW_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: "Debug: Current directory and files"
        run: |
          echo "Current directory: $(pwd)"
          ls -l

      - name: Verify delete_analysis_results_handler_lambda.zip exists
        run: |
          if [ ! -f $(pwd)/delete_analysis_results_handler_lambda.zip ]; then echo "delete_analysis_results_handler_lambda.zip does not exist"; exit 1; fi

      - name: Deploy delete_analysis_results to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name delete_analysis_results \
            --zip-file fileb://$(pwd)/delete_analysis_results_handler_lambda.zip
