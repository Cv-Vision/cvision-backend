name: Deploy to AWS Lambda - scheduler

on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'lambda/scheduler/**'
  pull_request:
    branches:
      - master
      - dev
    paths:
      - 'lambda/scheduler/**'

jobs:
  deploy:
    name: deploy_scheduler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies and package Lambda for scheduler
        run: |
          cd lambda/scheduler
          pip install -r requirements.txt -t python  
          cp scheduler_handler.py python/ 
          cd python
          zip -r ../../../scheduler_handler_lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.NEW_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NEW_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: "Debug: Current directory and files"
        run: |
          echo "Current directory: $(pwd)"
          ls -l

      - name: Verify scheduler_handler_lambda.zip exists
        run: |
          if [ ! -f $(pwd)/scheduler_handler_lambda.zip ]; then echo "scheduler_handler_lambda.zip does not exist"; exit 1; fi

      - name: Deploy scheduler to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name scheduler \
            --zip-file fileb://$(pwd)/scheduler_handler_lambda.zip

