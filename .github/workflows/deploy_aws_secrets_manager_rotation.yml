name: Deploy to AWS Lambda - aws_secrets_manager_rotation

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: deploy_aws_secrets_manager_rotation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies and package Lambda for aws_secrets_manager_rotation
        run: |
          cd lambda/aws_secrets_manager_rotation
          pip install -r requirements.txt -t python  
          cp aws_secrets_manager_rotation_handler.py python/ 
          cd python
          zip -r ../../../aws_secrets_manager_rotation_handler_lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.NEW_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NEW_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: "Debug: Current directory and files"
        run: |
          echo "Current directory: $(pwd)"
          ls -l

      - name: Verify aws_secrets_manager_rotation_handler_lambda.zip exists
        run: |
          if [ ! -f $(pwd)/aws_secrets_manager_rotation_handler_lambda.zip ]; then echo "aws_secrets_manager_rotation_handler_lambda.zip does not exist"; exit 1; fi

      - name: Deploy create-job-description to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name aws_secrets_manager_rotation \
            --zip-file fileb://$(pwd)/aws_secrets_manager_rotation_handler_lambda.zip

