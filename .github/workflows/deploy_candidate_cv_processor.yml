name: Deploy to AWS Lambda - candidate-cv-processor

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: candidate-cv-processor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies and package Lambda for candidate-cv-processor
        run: |
          cd lambda/candidate_cv_processor
          pip install -r requirements.txt -t python
          cp candidate_cv_processor_handler.py python/
          cd python
          zip -r ../../../candidate_cv_processor_handler_lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: "Debug: Current directory and files"
        run: |
          echo "Current directory: $(pwd)"
          ls -l

      - name: Verify candidate_cv_processor_handler_lambda.zip exists
        run: |
          if [ ! -f $(pwd)/candidate_cv_processor_handler_lambda.zip ]; then echo "candidate_cv_processor_handler_lambda.zip does not exist"; exit 1; fi

      - name: Deploy candidate-cv-processor to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name Candidate-cv-processor \
            --zip-file fileb://$(pwd)/candidate_cv_processor_handler_lambda.zip