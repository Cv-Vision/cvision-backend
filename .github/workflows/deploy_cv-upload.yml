name: Deploy Lambda Function - cv-upload

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  deploy:
    name: deploy_cv-upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies and package Lambda for cv-upload
        run: |
          cd lambda/cv_upload
          pip install -r requirements.txt -t python
          cp cv-upload_handler.py python/
          cd python
          zip -r ../../../cv-upload_lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Update Lambda function code (with retry)
        run: |
          MAX_RETRIES=5
          COUNT=0
          until aws lambda update-function-code --function-name cv-upload --zip-file fileb://cv-upload_lambda.zip || [ $COUNT -eq $MAX_RETRIES ]; do
            echo "Update code failed, retrying in 10 seconds..."
            sleep 10
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "Failed to update Lambda code after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Wait for Lambda function to be ready
        run: |
          while true; do
            STATUS=$(aws lambda get-function-configuration --function-name cv-upload --query 'State' --output text)
            if [ "$STATUS" == "Active" ]; then
              break
            fi
            echo "Function state is $STATUS. Waiting 5 seconds..."
            sleep 5
          done

      - name: Cleanup generated files
        run: |
          rm -f cv-upload_lambda.zip
          rm -rf lambda/cv_upload/python
